# Project configuration overview. Python scripts expose their own documented CLI
# options and use config/energy_apps_shortlist.csv as the app-ID catalog.
project:
  name: energy-app-review-sentiment-rating-prediction
  title: Energy App Review Sentiment Analysis and Rating Prediction

data:
  sources:
    - google_play
    - apple_app_store
  language: en
  english_confidence: 0.92
  min_words_for_language_detection: 5
  app_catalog: config/energy_apps_shortlist.csv
  raw_path: data/raw/energy_app_reviews_raw.csv
  processed_path: data/processed/energy_app_reviews_cleaned.csv

labels:
  sentiment:
    negative_ratings: [1, 2]
    neutral_ratings: [3]
    positive_ratings: [4, 5]

modeling:
  random_seed: 42
  split: StratifiedGroupKFold
  grouping: normalized_cleaned_review_text
  train_fraction_approx: 0.6
  validation_fraction_approx: 0.2
  test_fraction_approx: 0.2
  model_selection_metric: macro_f1
  sentiment_model_path: models/final_sentiment_model.pkl
  rating_model_path: models/final_rating_model.pkl
